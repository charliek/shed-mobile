name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Native ubuntu build. `flutter build linux --debug` compiles the Rust bridge
  # lib via cargokit for the x86_64 HOST (a native build, not a cross-compile),
  # so cargo runs inside it — rust-cache below keeps that fast.
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Pinned exactly — do not rely on `channel: stable` drifting (PLAN §13 A6).
          flutter-version: 3.44.2
          channel: stable
      # Private git dependency (stridelabs_drive lives in a private repo). The
      # ssh-agent must be loaded before `pub get` resolves the git dep.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRIDELABS_FLUTTER_SSH_KEY }}
      # Cache the cargo registry + git checkouts (and `rust/target`). `~/.cargo/git`
      # matters most: the shed git-dep clones the WHOLE monorepo per job. NOTE:
      # `workspaces: rust` caches `rust/target`, but cargokit passes `--target-dir`
      # into per-platform temp build dirs, so the platform BUILD jobs
      # (linux/macos/android) reuse only the registry/git data, not compiled
      # artifacts; only the codegen-drift job (plain `cargo` in `rust/`) gets the
      # full `rust/target` benefit. (Remapping the per-platform target-dir is not
      # worth it — registry/git reuse is where the win is.)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Guard: the committed Cargo.lock must resolve shed-core/shed-app to the
      # exact git rev pinned in rust/Cargo.toml — the gitignored local [patch]
      # (rust/.cargo/config.toml) must never leak a local path into the lock.
      - name: Lock-rev equality
        run: bash scripts/check-lock-rev.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Rust bridge-crate unit tests (shed-mobile#9: CI ran NO cargo test, so the
      # whole credential/transport half of the app — `rust/src/api/` — was
      # ungated; `flutter build linux` below only COMPILES it). `--locked`
      # additionally proves the committed lock resolves without drift, which the
      # text-level lock-rev guard above cannot: no local [patch] exists on a CI
      # checkout (rust/.cargo/config.toml is gitignored), so this is the
      # canonical resolution.
      - name: Rust bridge crate tests
        run: cd rust && cargo test --locked
      - name: Install Linux desktop build deps
        # libsecret-1-dev + libjsoncpp-dev are required by flutter_secure_storage_linux.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      # Native host build: compiles the Rust lib (cargo, via cargokit) + links it.
      - run: flutter build linux --debug

      # ---- the hermetic integration harness (plan 018 §3.13) --------------
      #
      # A STEP in this job rather than a job of its own: it reuses the Rust lib
      # `flutter build linux` above just compiled, this job's exact Flutter pin,
      # and the ssh-agent the private dep needs. A separate job would pay all
      # three again.
      #
      # It drives the real FRB bridge against shed's OWN gx/opencode fakes
      # (`desktop/tools/shedtest/fake_lane_server.py`), so it needs a shed
      # checkout — at the EXACT rev rust/Cargo.toml pins, because the fakes and
      # the adapters they were recorded from are one tree.
      - name: Resolve the pinned shed rev
        id: rev
        # VALIDATED HERE, at the producer, so every consumer below is handed a
        # value that cannot be shell. The script reads the rev out of
        # `rust/Cargo.toml` — a file any pull request can edit — and this job
        # has an ssh-agent holding the private dep's key by the time the value
        # is used. An unvalidated output interpolated into a `run:` block is
        # shell source, so a crafted rev would be code execution against a
        # credential-holding job. 40 lowercase hex, or the job fails here.
        run: |
          set -euo pipefail
          rev=$(bash scripts/check-lock-rev.sh --print-shed-rev)
          case "$rev" in
            *[!0-9a-f]*|"") echo "pinned shed rev is not lowercase hex: '$rev'" >&2; exit 1 ;;
          esac
          if [ "${#rev}" -ne 40 ]; then
            echo "pinned shed rev is ${#rev} chars, not 40: '$rev'" >&2
            exit 1
          fi
          echo "shed=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: charliek/shed
          ref: ${{ steps.rev.outputs.shed }}
          path: shed-sibling
          # This checkout is read-only — the harness only reads the fakes out
          # of it — so it has no use for a credential. `actions/checkout`
          # persists the job token into the clone's git config by default,
          # which would leave it sitting in a second working tree for the rest
          # of the job for no reason.
          persist-credentials: false
      # A checkout that silently resolved something else (a moved tag, a
      # default branch) would run the harness against fakes from a different
      # tree than the adapters under test — which is the one failure mode that
      # would look like a code bug.
      - name: Assert the sibling checkout is the pinned rev
        # Through `env`, never interpolated into the script body: belt to the
        # producer's braces above, and the form that stays safe if anyone ever
        # relaxes that validation.
        env:
          WANT_SHED_REV: ${{ steps.rev.outputs.shed }}
        run: |
          set -euo pipefail
          got=$(git -C shed-sibling rev-parse HEAD)
          if [ "$got" != "$WANT_SHED_REV" ]; then
            echo "shed-sibling is at $got, not the pinned $WANT_SHED_REV" >&2
            exit 1
          fi
          test -f shed-sibling/desktop/tools/shedtest/fake_lane_server.py
      - name: Install the headless desktop deps
        run: sudo apt-get install -y xvfb dbus-x11
      # `dbus-run-session` is UNCONDITIONAL, not a fallback. The cells never
      # touch flutter_secure_storage (no `main()`, no MachineStore), but plugin
      # registration at app start may still want a session bus — and a gate
      # that depends on the environment is not a gate.
      #
      # ONE `flutter test` per file: a single invocation naming several files
      # relaunches the app per file, and on the Linux desktop device the SECOND
      # launch always fails ("Unable to start the app on the device"). It is
      # positional rather than file-specific. Mirrors `make
      # test-integration-linux`; every file runs even after one fails.
      - name: Integration harness (Linux desktop, hermetic)
        env:
          SHED_CHECKOUT: ${{ github.workspace }}/shed-sibling
        run: |
          set -uo pipefail
          failed=""
          for f in integration_test/*_test.dart; do
            echo "=== $f"
            xvfb-run -a dbus-run-session -- flutter test "$f" -d linux || failed="$failed $f"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed" >&2; exit 1; fi

  # macOS arm64 native build — so the mac artifact is CI-gated, not dev-only.
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Same exact pin as flutter-check.
          flutter-version: 3.44.2
          channel: stable
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRIDELABS_FLUTTER_SSH_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter pub get
      # arm64 native build — compiles the Rust staticlib (cargo, via cargokit).
      - run: flutter build macos --debug

  # Android cross-compile (arm64). Exercises the vendored cargokit Gradle-9 patch
  # (project.exec -> injected ExecOperations) + rust_builder/android compileSdk 36.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Same exact pin as flutter-check.
          flutter-version: 3.44.2
          channel: stable
      # Gradle 9 requires JDK 17+; android/app/build.gradle.kts targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRIDELABS_FLUTTER_SSH_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter pub get
      - name: Add Android arm64 Rust target
        # cargokit's prepare() now installs the Android target for the PINNED
        # toolchain itself (the vendored build_tool reads rust/rust-toolchain.toml
        # and runs `rustup run <version> cargo …`), so this step is no longer
        # load-bearing. Keep the pinned add as a fast-fail belt-and-suspenders so
        # a broken rustup/target surfaces here with a clear message rather than
        # deep inside the gradle build.
        run: (cd rust && rustup target add aarch64-linux-android)
      # Single ABI keeps CI time sane. The NDK is auto-installed by sdkmanager
      # during the gradle build (android/app delegates to flutter.ndkVersion).
      # This build exercises the vendored cargokit Gradle-9 patch.
      - run: flutter build apk --debug --target-platform android-arm64
      # 16 KB page-alignment gate + native-lib size record (every .so, every
      # ABI; 64-bit enforced, 32-bit recorded — see the shared script). Debug
      # alignment holds with NDK r28; this catches toolchain drift early.
      # arm64-v8a is the ABI we build for; cargokit adds extra debug ABIs,
      # which the script classifies fail-closed.
      - name: Verify 16 KB alignment + record native-lib sizes
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y llvm unzip binutils
          APK=$(find build/app/outputs -name '*.apk' -print -quit)
          echo "APK: $APK"
          WORK=$(mktemp -d)
          unzip -o -q "$APK" -d "$WORK"
          bash scripts/check-16kb-alignment.sh "$WORK/lib" arm64-v8a

  # Committed-glue drift guard: regenerate with the PINNED codegen and assert the
  # generated outputs are byte-identical to what's committed (mirrors `make frb-gen`).
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Same exact pin as flutter-check.
          flutter-version: 3.44.2
          channel: stable
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRIDELABS_FLUTTER_SSH_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The FRB codegen binary install is slow (~5-10 min compile), so cache the
      # built binary keyed by the pinned version — it pays only on a version bump.
      - name: Cache flutter_rust_bridge_codegen binary
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen*
          key: frb-codegen-2.13.0-beta.5
      - name: Install pinned flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0-beta.5 --locked
      # FRB's `generate` shells out to `cargo expand`; on a cold runner missing it
      # FRB auto-installs an UNPINNED cargo-expand, which is a tool-dependent drift
      # source. Pin it to the version dev uses (cargo expand --version) so the
      # generated glue is reproducible. Cache the built binary keyed by version —
      # it pays only on a version bump.
      - name: Cache cargo-expand binary
        id: cargo-expand-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-expand*
          key: cargo-expand-1.0.123
      - name: Install pinned cargo-expand
        if: steps.cargo-expand-cache.outputs.cache-hit != 'true'
        # Runs with the runner's default (latest stable) toolchain, which builds
        # cargo-expand fine. LOCALLY the same command can fail — a default
        # toolchain older than cargo-expand's MSRV errors out, FRB then silently
        # falls back to whatever older cargo-expand it can find, and the drift
        # shows up HERE as a mystery diff. Install it locally with the pinned
        # toolchain: `cargo +1.97.1 install cargo-expand --version 1.0.123
        # --locked` (see README).
        run: cargo install cargo-expand --version 1.0.123 --locked
      - run: flutter pub get
      # The mandatory two-step codegen (mirror `make frb-gen`): FRB generate THEN
      # build_runner expands the @freezed sealed-class sources. The explicit
      # `dart run build_runner build` intentionally mirrors `make frb-gen` even
      # though FRB may auto-run build_runner itself (a harmless double-run).
      - name: Regenerate bridge glue (two-step)
        run: |
          flutter_rust_bridge_codegen generate
          dart run build_runner build
      # Scope the diff to generated outputs so unrelated tool churn can't
      # false-positive; git status catches NEW untracked generated files too.
      - name: Assert no drift in generated glue
        run: |
          set -euo pipefail
          PATHS="lib/src/rust rust/src/frb_generated.rs"
          git diff --exit-code -- $PATHS
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            echo "Untracked/changed generated files under: $PATHS" >&2
            git status --porcelain -- $PATHS >&2
            exit 1
          fi
