[package]
name = "rust_lib_shed_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
# Cross-repo shed client core (FRB de-risking spike, plan §3.1).
# Canonical source is git+rev; a LOCAL sibling-checkout override lives in
# .cargo/config.toml (gitignored; see .cargo/config.toml.template).
# shed-app pulled with DEFAULT features (RcEventsWatcher); NO features = ["rc"].
shed-core = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e" }
shed-app  = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e" }
# The opencode agent-lane adapter (plan 015), reached the same way and pinned
# to the SAME rev as shed-core/shed-app — one shed tree, one rev. It is
# named here rather than reached through shed-app because shed-app does not
# depend on it: an adapter is chosen by the client at the point it opens a
# lane, so the client is what has to name it.
#
# It had not been on a phone before that plan, so `android-build` is the first
# thing that would notice a dependency it cannot cross-compile; the gate
# checks it for `aarch64-linux-android` explicitly.
shed-opencode = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e" }
# The craze agent-lane adapter (plan 025): a machine's craze hub as an
# `AgentSource`, and each of its sessions as an `AgentLane`. Named for the
# same reason shed-opencode is — the client chooses the adapter — and pinned
# to the SAME rev: the four shed crates are one tree at one rev, and
# `check-lock-rev.sh` refuses a split. It joins the pinned set at the re-pin
# (CM2), before anything here calls it (the phone's craze source is CM3), so
# the lock guard and the Android check cover it from the first commit that
# names it — and it must cross-compile for `aarch64-linux-android`, which
# shed-craze's own manifest promises (no reqwest, no chrono).
shed-craze = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e" }
# roost's own IPC crate (plan 013 S3m / the Roost Pivot). Named DIRECTLY, not
# reached through shed-app, for two things shed-app does not re-export: the
# `TabOpenParams` a `tab.open` takes, and `ssh::remote_command()` — the opaque
# remote command string `RoostTunnel` execs on the far side.
#
# **The rev is the one `shed-core`'s own manifest pins**, so cargo unifies the
# two into ONE source and mobile can never end up talking a different wire than
# the core it links. A bump is therefore a two-file edit in lockstep with shed's
# `crates/Cargo.toml`; roost publishes no Rust-API stability promise, which is
# what the pin absorbs (roost `docs/reference/ipc-compatibility.md`).
#
# That lockstep is enforced by CARGO, not by a script: git deps unify on
# `(url, rev)`, so a rev that differs from shed-core's produces TWO `roost-ipc`
# crates in one graph and `TabOpenParams`/`remote_command` stop type-checking.
# `scripts/check-lock-rev.sh` also asserts the lock matches this line, which is
# belt-and-braces — the compile failure is the real gate.
roost-ipc = { git = "https://github.com/charliek/roost", rev = "2bc71fa3848ddbf2d190aab6c4ef61ad2d432aa1" }
# Direct tokio use by the bridge slices: the persistent runtime, oneshot mint
# registry, local SSE test servers (net/io-util), and time-bounded awaits.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = "1"
serde_json = "1"
# The shed-core `TokenMinter` trait is `#[async_trait]`; the bridge minter impl
# must use the same macro (same version family as shed's lock).
async-trait = "0.1"
# **Types only, never a client this crate builds.** `OpencodeClient::new` takes
# a `reqwest::Url`, so `api/lane.rs` cannot dispatch the opencode arm without
# naming the crate. No HTTP is issued from here — every request belongs to the
# adapter.
#
# `default-features = false` is load-bearing: reqwest's defaults pull
# `default-tls` (native-tls, and with it an OpenSSL stack), which would ADD
# packages to the lock. shed-core already pins it as
# `default-features = false, features = ["rustls-tls", "stream", "json"]`, and
# cargo unifies features — so declaring nothing here inherits exactly that set
# and the lock gains one dependency EDGE and no package.
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
# Test-only: signing a certificate for the CSR a `ControlTokenProvider` generated
# mid-test. The provider VERIFIES that an adopted certificate belongs to the key
# it just made, so the token↔mtls flip tests cannot use a canned fixture — they
# have to sign the live CSR. Same spec as shed-core's (default-features off + the
# `ring` backend rustls already pulls in), so no second rcgen enters the lock and
# no C/asm stack (`aws_lc_rs`) ever does.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# Standard-alphabet base64 for those test fixtures (decode a `csr=` value, encode
# a leaf PEM). Already in the tree via shed-core/reqwest.
base64 = "0.22"
# shed-core's in-process fake `roost-session` (`roost::testing::FakeRoost`),
# behind its non-default `test-support` feature, so the roost watcher test drives
# the REAL watcher against a REAL socket instead of a re-implementation of one.
# A dev-dependency (resolver v2) so the feature is enabled for `cargo test` and
# NEVER for a shipped build — the same shape shed-app uses for the same fake.
# Same git+rev as the [dependencies] entry above; cargo unifies them.
shed-core = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e", features = ["test-support"] }
# The opencode agent-lane adapter's in-process double
# (`shed_opencode::testing::FakeOpencode`), behind the SAME non-default
# `test-support` feature and the SAME git+rev as the `[dependencies]` entry
# above — cargo unifies them, and the feature adds no package to the lock
# (it declares `test-support = []`).
#
# It is what lets `api/lane.rs`'s dispatch tests drive the REAL adapter against
# a real loopback HTTP server instead of a re-implementation of one, which is
# the whole point: the thing under test is the bridge's dispatch, its roster GET
# and its pump, and a hand-rolled fake adapter would test none of them.
shed-opencode = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e", features = ["test-support"] }
# The craze adapter's scripted hub (`shed_craze::testing::ScriptedDial`: every
# connection an in-memory duplex the test plays craze on), behind the same
# non-default `test-support` feature and the SAME git+rev — `test-support = []`,
# so no package joins the lock. It is what lets `api/craze.rs`'s tests drive the
# REAL `CrazeSource` — its roster pump, its created rows, a lane opened through
# it and the session's end said back to it (plan 025 Amendment A16) — instead
# of a re-implementation of one.
shed-craze = { git = "https://github.com/charliek/shed", rev = "9a84ddfe57827498e31080e1d5fdd7b73184e42e", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# **Tuned dev profile** (plan 012), matching `shed/crates/Cargo.toml` — see its
# profile comment for the measurements. Repeated rather than inherited because
# this is a separate workspace.
#
# It matters more here than anywhere: cargokit builds this crate once PER
# ANDROID ABI (arm64, x86_64, …), so the debug-info cost is multiplied by the
# ABI count on every `flutter run`, and it lands in `build/` rather than a
# shared target dir.
#
# `line-tables-only` keeps `file:line` in panics, which is what an FRB bridge is
# debugged with — a Rust panic surfaces to Dart as an error string, so a
# debugger stepping into Rust was never the workflow anyway.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The release half of the same standard (`shed/crates/Cargo.toml`). On a phone
# the payoff is the shipped `.so`: `strip` alone takes the bridge library from
# tens of MB to a few, and it ships once per ABI in the APK.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
